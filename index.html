<main>
<section class="panel"><h2 class="section-title">직원변경 정보</h2><div class="grid">
<div class="full"><label>소속 위탁사 *</label><select id="company"></select></div>
<div class="full"><label>단지명 *</label><input id="apartment"></div>
<div class="full"><label>변경 구분 *</label><div class="radio-row"><label><input type="radio" name="changeType" value="입사" checked>입사</label><label><input type="radio" name="changeType" value="퇴사">퇴사</label></div></div>
<div class="hire"><label>실제 직책 *</label><input id="position"></div>
<div class="hire"><label>보험료 직급 *</label><select id="tier"><option value="">선택해 주세요</option><option value="12000">관리소장급 (12,000원)</option><option value="9000">회계과장급 (9,000원)</option><option value="4000">기술직급 (4,000원)</option></select></div>
<div><label>성명 *</label><input id="name"></div><div class="hire"><label>생년월일 *</label><input id="birth" type="date"></div>
<div><label>직원변경일 *</label><input id="changeDate" type="date"></div>
<div id="phoneWrap" class="hidden"><label>전화번호 *</label><input id="phone"></div>
<div id="addressWrap" class="full hidden"><label>주소 *</label><input id="address"></div>
<div class="full hire"><div class="fee-help"><b>보험료 직급 안내</b><br>관리소장 12,000원 / 경리·서무주임·전기선임·관리과장·관리팀장·관리부장 등 9,000원 / 기계·소방선임 및 그 외 가입대상 4,000원<br><b>경비·미화·커뮤니티 업무 종사자는 가입대상이 아닙니다.</b></div></div>
</div>
<div class="hire"><h2 class="section-title" style="margin-top:20px">전자서명</h2>
<div class="notice">서명 이미지는 각 회사 양식의 <b>(인) 영역을 기준으로 자동 배치</b>됩니다.</div>
<div class="signature-box"><canvas id="signature" width="700" height="180"></canvas><div style="text-align:right;margin-top:7px"><button class="secondary" id="clearSig">서명 지우기</button></div></div></div>
<div class="actions"><button class="primary" id="pdfBtn">PDF 다운로드</button><button class="secondary" id="resetBtn">초기화</button></div>
<button class="submit" id="submitBtn">접수완료</button><div id="submitStatus" class="submit-status"></div><div class="help">현재는 양식/입력 위치 최종 검수용입니다. Google Sheets 저장은 검수 후 연결합니다.</div>
</section>
<section class="panel"><div class="preview-head"><h2>취업규칙동의서 실시간 미리보기</h2><div class="status" id="status"></div></div>
<div class="preview-shell"><div id="pageViewport"><img id="baseSvg"><img id="lineRepair"></div></div></section>

 if(company.value==='daehan_total'){required.push(['phone','전화번호'],['address','주소'])}
 for(const [id,label] of required){if(!val(id)){alert(label+'을(를) 입력해 주세요.');$(id)?.focus();return false}}
 if(hire&&!signatureData){alert('전자서명을 해 주세요.');return false}
 return true;
}
async function buildPdf(){
 const c=cfg(),old=viewport.style.transform,oldMode=exportMode;
 exportMode=true;render(false);viewport.style.transform='none';
 try{
   const shot=await html2canvas(viewport,{scale:2,backgroundColor:'#fff',useCORS:true});
   const{jsPDF}=window.jspdf,pdf=new jsPDF('p','pt',[c.w,c.h]);
   pdf.addImage(shot.toDataURL('image/jpeg',.98),'JPEG',0,0,c.w,c.h);
   const filename=`${c.name}_${val('apartment')||'단지'}_${val('name')||'직원'}_취업규칙동의서.pdf`;
   return {blob:pdf.output('blob'),filename};
 } finally {
   viewport.style.transform=old;exportMode=oldMode;render(false);
 }
}
$('pdfBtn').onclick=async()=>{
 const {blob,filename}=await buildPdf();
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
};
$('submitBtn').onclick=async()=>{
 if(!validateRequired())return;
 const btn=$('submitBtn'),status=$('submitStatus');
 btn.disabled=true;btn.textContent='접수 처리 중...';status.textContent='';status.className='submit-status';
 try{
   const {blob,filename}=await buildPdf();
   const webhook=(window.INS_UPLOAD_WEBHOOK_URL||'').trim();
   if(!webhook){
     status.textContent='관리자 업로드 웹훅 주소가 아직 설정되지 않았습니다.';
     status.className='submit-status err';
     alert('PDF 생성은 완료됐지만 Google Drive 업로드용 웹훅 주소가 아직 설정되지 않았습니다.');
     return;
   }
   const form=new FormData();
   form.append('pdf',blob,filename);
   form.append('filename',filename);
   form.append('company',cfg().name);
   form.append('company_slug',company.value);
   form.append('apartment',val('apartment'));
   form.append('change_type',document.querySelector('input[name=changeType]:checked').value);
   form.append('position',val('position'));
   form.append('tier',val('tier'));
   form.append('fee',fee());
   form.append('name',val('name'));
   form.append('birth',val('birth'));
   form.append('change_date',val('changeDate'));
   form.append('phone',val('phone'));
   form.append('address',val('address'));
   form.append('submitted_at',new Date().toISOString());
   const res=await fetch(webhook,{method:'POST',body:form});
   if(!res.ok)throw new Error('HTTP '+res.status);
   status.textContent='접수 완료 · PDF 관리자 전송 완료';
   status.className='submit-status ok';
   alert('접수가 완료되었습니다.');
 }catch(err){
   console.error(err);
   status.textContent='접수 실패 · 관리자 전송 중 오류가 발생했습니다.';
   status.className='submit-status err';
   alert('접수 중 오류가 발생했습니다. 다시 시도해 주세요.');
 }finally{
   btn.disabled=false;btn.textContent='접수완료';
 }
};
$('changeDate').value=new Date().toISOString().slice(0,10);load();
